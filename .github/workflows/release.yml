name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - run: bun install

      - name: Test
        run: bun test

      - name: Build binary
        run: bun run build

      - name: Package tarball
        run: tar -czf cntui-darwin-arm64.tar.gz cntui

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            cntui
            cntui-darwin-arm64.tar.gz

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 cntui-darwin-arm64.tar.gz | awk '{print $1}')
          URL="https://github.com/nycjay/cntui/releases/download/${GITHUB_REF_NAME}/cntui-darwin-arm64.tar.gz"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/nycjay/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          cat > Formula/cntui.rb << EOF
          class Cntui < Formula
            desc "Terminal UI for Apple's container runtime"
            homepage "https://github.com/nycjay/cntui"
            url "${URL}"
            sha256 "${SHA}"
            license "MIT"
            version "${VERSION}"

            depends_on :macos

            def install
              bin.install "cntui"
            end

            test do
              assert_match "cntui", shell_output("#{bin}/cntui --version", 1)
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Formula/cntui.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cntui.rb
          git commit -m "cntui ${VERSION}"
          git push
